<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="ash-title ash-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ash-title">Arjun Santhosh</title>
  <desc id="ash-desc">Full-stack developer working with Flutter, Python, Django, Flask and React. Burgundy animated banner.</desc>

  <defs>
    <linearGradient id="ash-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="55%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#451126"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.08 0; 0.08 0; -0.08 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="ash-halo" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ash-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>

    <pattern id="ash-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <filter id="ash-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="320" fill="url(#ash-bg)"/>
  <rect width="1200" height="320" fill="url(#ash-grid)"/>
  <rect width="1200" height="320" fill="url(#ash-halo)"/>

  <!-- Restrained orbital geometry -->
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35">
    <circle cx="930" cy="150" r="115" stroke-dasharray="2 8"/>
    <circle cx="930" cy="150" r="72" stroke-opacity="0.5"/>
    <circle cx="930" cy="150" r="28" stroke="#E5B5C7" stroke-opacity="0.6"/>
  </g>
  <g>
    <circle cx="1045" cy="150" r="5" fill="#E5B5C7" filter="url(#ash-glow)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 930 150" to="360 930 150" dur="24s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="930" cy="78" r="3.5" fill="#C77B9B"/>
    <animateTransform attributeName="transform" type="rotate" from="360 930 150" to="0 930 150" dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- Animated drawn path (full line is visible if motion is unsupported) -->
  <path d="M0 292 C 180 250, 330 318, 520 272 S 840 236, 1200 284"
        fill="none" stroke="url(#ash-line)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="1400" stroke-dashoffset="0" filter="url(#ash-glow)">
    <animate attributeName="stroke-dashoffset" values="1400;0" dur="3.2s" begin="0s" fill="freeze"/>
  </path>

  <!-- Text -->
  <text x="70" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#F8F0F3" letter-spacing="1">Arjun Santhosh</text>

  <!-- Glowing underline -->
  <rect x="72" y="160" width="460" height="3" rx="1.5" fill="url(#ash-line)" filter="url(#ash-glow)">
    <animate attributeName="width" values="0;460" dur="1.6s" begin="0.3s" fill="freeze"/>
  </rect>

  <text x="70" y="206" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#E5B5C7">Full-Stack Developer  |  Flutter and Python  |  MCA Student</text>
  <text x="70" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#C77B9B">NASA Space Apps Global Nominee 2025. Real-world apps, clean backend logic, reliable APIs.</text>
</svg>
