<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Open to collaborations and new opportunities" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ashf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07110B"/>
      <stop offset="50%" stop-color="#0B1B12"/>
      <stop offset="100%" stop-color="#07110B"/>
    </linearGradient>
    <linearGradient id="ashf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A7A4C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B6EBCF"/>
      <stop offset="100%" stop-color="#1A7A4C" stop-opacity="0"/>
    </linearGradient>
    <filter id="ashf-glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="90" fill="url(#ashf-bg)"/>
  <rect x="150" y="18" width="900" height="2" fill="url(#ashf-line)" filter="url(#ashf-glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F0F9F4">Open to collaborations and new opportunities. Let's build something impactful.</text>
</svg>
